apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: observability
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.enabled: true
    xpack.monitoring.elasticsearch.hosts: ["http://elasticsearch:9200"]
    pipeline.workers: 2
    pipeline.batch.size: 125
    pipeline.batch.delay: 50
  
  logstash.conf: |
    input {
      # TCP input for JSON logs from applications
      tcp {
        port => 5000
        codec => json_lines
        tags => ["tcp"]
      }
      
      # Beats input for Filebeat
      beats {
        port => 5044
        tags => ["beats"]
      }
      
      # HTTP input for direct ingestion
      http {
        port => 8080
        codec => json
        tags => ["http"]
      }
    }
    
    filter {
      # Parse JSON if message is a string
      if [message] =~ /^\{/ {
        json {
          source => "message"
          target => "parsed"
        }
      }
      
      # Add kubernetes metadata if available
      if [kubernetes] {
        mutate {
          add_field => {
            "k8s_namespace" => "%{[kubernetes][namespace]}"
            "k8s_pod" => "%{[kubernetes][pod][name]}"
            "k8s_container" => "%{[kubernetes][container][name]}"
          }
        }
      }
      
      # Parse timestamp
      date {
        match => ["@timestamp", "ISO8601"]
        target => "@timestamp"
      }
      
      # Add environment tag
      mutate {
        add_field => { "environment" => "${ENVIRONMENT:dev}" }
      }
      
      # Remove unnecessary fields
      mutate {
        remove_field => ["host", "port", "@version"]
      }
    }
    
    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "logs-%{[application]}-%{+YYYY.MM.dd}"
        template_name => "project-forge-logs"
        template_overwrite => true
      }
      
      # Debug output (disable in production)
      # stdout { codec => rubydebug }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: observability
  labels:
    app: logstash
    component: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
        component: logging
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.11.0
          ports:
            - containerPort: 5000
              name: tcp
            - containerPort: 5044
              name: beats
            - containerPort: 8080
              name: http
            - containerPort: 9600
              name: monitoring
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: logstash-config
            items:
              - key: logstash.yml
                path: logstash.yml
        - name: pipeline
          configMap:
            name: logstash-config
            items:
              - key: logstash.conf
                path: logstash.conf
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: observability
  labels:
    app: logstash
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: tcp
    - port: 5044
      targetPort: 5044
      name: beats
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: logstash

