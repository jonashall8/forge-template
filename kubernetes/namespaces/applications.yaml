apiVersion: v1
kind: Namespace
metadata:
  name: applications
  labels:
    name: applications
    project: project-forge
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: applications-quota
  namespace: applications
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "100"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: applications-limits
  namespace: applications
spec:
  limits:
    - default:
        cpu: "1"
        memory: "1Gi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      type: Container

