apiVersion: v2
name: observability-stack
description: Project Forge Observability Stack - ELK, Prometheus, Grafana
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - observability
  - monitoring
  - logging
  - prometheus
  - grafana
  - elasticsearch
  - kibana
home: https://github.com/yourusername/project-forge
sources:
  - https://github.com/yourusername/project-forge
maintainers:
  - name: Project Forge Team
    email: team@projectforge.io
dependencies:
  - name: prometheus
    version: "25.0.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: "7.0.0"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
  - name: elasticsearch
    version: "8.5.1"
    repository: https://helm.elastic.co
    condition: elasticsearch.enabled

