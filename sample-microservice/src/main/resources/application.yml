# Sample Microservice Configuration
spring:
  application:
    name: sample-microservice

server:
  port: 8080

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# Project Forge Observability Configuration
projectforge:
  observability:
    enabled: true
    application-name: ${spring.application.name}
    environment: ${ENVIRONMENT:dev}
    
    logging:
      enabled: true
      include-correlation-id: true
      include-stack-trace: true
    
    metrics:
      enabled: true
      enable-jvm-metrics: true
      enable-http-metrics: true
    
    tracing:
      enabled: true
      exporter-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      sampling-rate: 1.0
      propagate-context: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.projectforge: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: INFO
    com.projectforge: INFO

projectforge:
  observability:
    environment: prod
    tracing:
      sampling-rate: 0.1

