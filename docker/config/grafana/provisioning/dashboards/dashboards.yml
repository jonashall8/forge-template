# Grafana dashboard provisioning
apiVersion: 1

providers:
  - name: 'Project Forge Dashboards'
    orgId: 1
    folder: 'Project Forge'
    folderUid: 'project-forge'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards

