# Logstash configuration for local development
input {
  # TCP input for JSON logs
  tcp {
    port => 5000
    codec => json_lines
    tags => ["tcp"]
  }
  
  # Beats input
  beats {
    port => 5044
    tags => ["beats"]
  }
}

filter {
  # Add timestamp if not present
  if ![timestamp] {
    ruby {
      code => "event.set('timestamp', Time.now.utc.iso8601(3))"
    }
  }
  
  # Parse JSON message if present
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
    }
  }
  
  # Add environment
  mutate {
    add_field => { "environment" => "local" }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => ["host", "port", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{[application]}-%{+YYYY.MM.dd}"
  }
  
  # Debug output
  stdout { 
    codec => rubydebug 
  }
}

